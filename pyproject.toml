[project]
name = "Kona"
version = "0.1.0"
description = "Kona"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "openai>=2.48.0",
    "anthropic>=0.120.0",
    "mcp[cli]>=1.28.1",
    "jmcomic>=2.7.2",
    "img2pdf>=0.6.3",
]

[project.optional-dependencies]
dev = [
    "pyright[nodejs]"
]

[tool.nonebot]
plugin_dirs = ["kona/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []

[tool.pyright]
# For Pylance/Pyright configurations, see https://microsoft.github.io/pyright/#/configuration.
pythonVersion = "3.9"
pythonPlatform = "All"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
